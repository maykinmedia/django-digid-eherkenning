[tox]
envlist =
    py{312,313,314}-django{52,60}-oidc{enabled,disabled}
    ruff
    docs
skip_missing_interpreters = true

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
DJANGO =
    5.2: django52
    6.0: django60
OIDC_ENABLED =
    yes: oidcenabled
    no: oidcdisabled

[testenv]
setenv =
    PYTHONPATH={toxinidir}
    oidcenabled: OIDC_ENABLED=yes
    oidcdisabled: IGNORE_OIDC=--ignore tests/oidc
passenv =
    OIDC_ENABLED
    PGUSER
    PGDATABASE
    PGPASSWORD
    PGPORT
    PGHOST
extras =
    tests
    oidcenabled: oidc
deps =
  django52: Django~=5.2
  django60: Django~=6.0
  oidcenabled: psycopg
commands =
  pytest tests \
   --cov --cov-report xml:reports/coverage-{envname}.xml \
   {env:IGNORE_OIDC} \
   {posargs}

[testenv:ruff]
extras = tests
skipsdist = True
commands =
    ruff check --output-format=github .
    ruff format --check

[testenv:docs]
basepython=python
changedir=docs
skipsdist=true
extras =
    oidc
    tests
    docs
allowlist_externals = make
commands=
    make SPHINXOPTS="-W" html
    make linkcheck
